name: Validate package

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: YAML + Jinja validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml jinja2

      - name: Validate the package
        run: python tests/validate_package.py packages/opendtu_ems.yaml

      - name: Validate the HACS integration
        run: python tests/validate_integration.py
