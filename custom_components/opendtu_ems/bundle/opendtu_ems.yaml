# =============================================================================
#  OpenDTU  ·  Battery-first / zero-export EMS      (Home Assistant 2026.10.1)
#  version 1.10.0  ·  2026-10-13  ·  see CHANGELOG.md
# -----------------------------------------------------------------------------
#  Drop-in replacement for the automation
#  "OpenDTU: Battery-First Aggressive EMS (Math-Based)".
#
#  GOALS
#   1) BATTERY FIRST: the array may produce everything the house load plus the
#      battery charge power needs. The target is computed from the wattage the
#      battery can still take, never from the momentary export, so a Victron
#      that is still ramping up (or a load switching off, or a lagging meter)
#      can no longer ratchet the array down while the battery still has charge
#      headroom - that was the "solar is cut even though the battery could take
#      it" failure of 1.4.x. The real charge limit is DVCC / BMS CCL.
#   2) never export: the grid is held at a small import bias (+20 W by default).
#      If the battery cannot take the offered power (BMS current limit, CV
#      phase, cold pack, ESS ramping) the loop LEARNS the real acceptance
#      ("EMS charge allowance") after "EMS export grace" and works at that
#      level from then on, and it probes upwards again by itself. See NOTES L.
#   3) FAIL-SAFE:
#        - battery monitoring gone  -> NO_BATTERY  mode = pure zero export
#                                      (the charge-push term is dropped !)
#        - grid meter gone / frozen -> GRID_BLIND  mode = safe low limit
#          (only when BOTH mapped meters fail: ems_src_grid is the primary and
#           ems_src_grid_backup the live backup; if they disagree the more
#           conservative value wins)
#        - the loop stops writing   -> watchdog applies the fail-safe limit
#   4) DAY START (1.10.0): at sunrise the array is held WIDE OPEN (100 %) until
#      there is something to throttle - the battery charging at its calculated
#      maximum, PV at full production ("EMS open until solar"), or a lasting
#      export. The morning is not capped at "house load + charge need" while the
#      pack still has headroom. See section 5b and the wiki page "How it works".
#   5) an inverter that is off (its limit entity is unavailable) is excluded
#      from the capacity, so its share is redistributed to the remaining ones:
#      they are driven to a higher percentage, up to 100 % each. An inverter
#      that is still reachable but produces nothing is caught by the delivery
#      check (sensor.ems_pv_delivery) and reported by the watchdog.
#   5) the Victron needs several seconds to change the charge current, so the
#      loop waits "EMS settle time" after every write and never increases the
#      limit by more than "EMS max step" at once (decreases are immediate)
#   6) if NO inverter is reachable (OpenDTU powered off, MQTT down, ids changed)
#      the loop stops writing and reports DTU_BLIND instead of pretending to
#      control something
#   7) STARTING (just booted, waiting "EMS start grace" for the sensors and the
#      ESS) and NIGHT (sun down, no PV) are normal standby states: nothing is
#      written, nothing is alarmed, and the loop takes over by itself
#  INSTALL
#   * save as  <config>/packages/opendtu_ems.yaml
#   * configuration.yaml must contain:
#         homeassistant:
#           packages: !include_dir_named packages
#   * restart Home Assistant
#   * fill the SENSOR MAPPING in section 1 (15 input_text helpers). Easiest with
#     the shipped script blueprint "OpenDTU EMS - the sensor names"
#     (blueprints/script/opendtu_ems/ems_map_sensors.yaml). sensor.ems_map_status
#     tells you what is still missing. Until the mapping is filled the loop
#     cannot read a single sensor and stays in GRID_BLIND / NO_BATTERY.
#   * DISABLE the old automation - this file replaces it. Never let two
#     automations write the inverter limits.
#
#  SECTIONS
#   1) entity ids + the sensor mapping     2) helpers      3) sensors
#   4) scripts (write + defaults)          5) control loop 5b) day start
#   6) watchdog/fail-safe                  7) startup      8) notes (pointer)
#
#  WIKI - the reasoning behind all of this:
#   https://github.com/acdcnow/opendtu-ems/wiki
#   (How it works - Charge allowance - Sensor mapping - Installation -
#    Dashboards - Reference - Troubleshooting - Upgrading)
# =============================================================================


# =============================================================================
# 1) ENTITY IDS  -  THE SENSOR MAPPING   (never type an entity id below this block)
# -----------------------------------------------------------------------------
#  Every sensor this file reads or writes belongs to another integration, so its
#  entity id is a name that can change: you rename it in the UI, a new inverter
#  arrives, the BMS integration is replaced. Up to 1.9.0 the ids were therefore
#  typed into ~60 places in this file and both dashboards, and ONE rename broke
#  the loop silently - usually by dropping into DTU_BLIND or GRID_BLIND.
#
#  Since 1.10.0 the ids live in the 15 input_text helpers below ("the mapping")
#  and every template, trigger, script and dashboard reads them from there. An
#  empty entry is a missing sensor: the loop degrades instead of erroring.
#
#  HOW TO FILL IT (once, and again after a rename)
#     * Settings > Devices & services > Helpers > the "EMS source - ..." rows
#       (plain text fields; paste the entity id), or
#     * import the shipped script blueprint
#       blueprints/script/opendtu_ems/ems_map_sensors.yaml and let it ask you for
#       every entity (Settings > Automations & scenes > Blueprints).
#    sensor.ems_map_status says which required entries are still missing.
#
#  WHAT EACH ENTRY MUST BE
#     ems_src_grid           grid meter, primary   (positive = import)
#     ems_src_grid_backup    grid meter, backup    (same metering point and the
#                            same sign; optional - leave "" for a single meter)
#     ems_src_solar          PV power, all inverters summed
#     ems_src_house_load     house consumption, W             (optional - see
#                            below; without it the EMS derives it itself)
#     ems_src_batt_soc       battery state of charge, %
#     ems_src_batt_power     battery power, SIGNED: positive = CHARGING
#     ems_src_batt_voltage   battery / DC bus voltage, V        (optional)
#     ems_src_batt_current   battery current, SIGNED: positive = CHARGING
#                                                              (optional, Victron)
#     ems_src_inv1_limit     inverter 1: number.*_limit_nonpersistent_relative
#     ems_src_inv2_limit     inverter 2: number.*_limit_nonpersistent_relative
#     ems_src_inv3_limit     inverter 3: number.*_limit_nonpersistent_relative
#     ems_src_inv1_power     inverter 1 ac_power   (dashboard only, optional)
#     ems_src_inv2_power     inverter 2 ac_power   (dashboard only, optional)
#     ems_src_inv3_power     inverter 3 ac_power   (dashboard only, optional)
#     ems_src_victron_state  Victron charge stage, e.g. "Bulk" (display only)
#
#  GRID ARBITRATION: both meters are read every cycle. If the primary dies or
#  freezes the backup is used automatically and sensor.ems_mode stays FULL. Only
#  if BOTH are dead/stale does the system enter GRID_BLIND (fail-safe limit,
#  export impossible). If both are alive but differ by more than "EMS meter
#  tolerance" the SMALLER value (more export) is used, so a lying meter can never
#  cause an export. The meter in use is the "source" attribute of
#  sensor.ems_grid_power.
#
#  BATTERY: the control law uses  charge power = voltage x current  whenever both
#  are mapped and readable and falls back to ems_src_batt_power otherwise. A
#  NEGATIVE current means the battery is DISCHARGING: that is not a charge limit
#  and must never curtail the array. The maximum charge power is
#  voltage x "EMS max charge current", so it follows the pack voltage.
#
#  HOUSE LOAD is only DISPLAY (the flow card, the sanity check) - the control
#  law computes  solar + grid + charge push - bias  directly and never reads it.
#  Map ems_src_house_load if your installation has its own house-consumption
#  sensor and you want the boards and the diagnostic flags to use THAT number;
#  left empty, sensor.ems_house_load is  solar + grid - battery  (its "source"
#  attribute says which of the two is in use).
#
#  INVERTER LIMITS are RELATIVE (percent) on purpose: one value drives a 1500 W
#  and two 1600 W inverters correctly, no "divide by 3" error, no per-model
#  min/max problem, and a relative limit cannot exceed the inverter rating. If
#  your OpenDTU only exposes *_limit_nonpersistent_absolute, each inverter needs
#  its own watt value and this file must be adapted.
#
#  If your battery power sensor is INVERTED (positive = discharging), the whole
#  calculation is wrong. Verify: battery charging => sensor > 0.
# =============================================================================

# the mapping - the ONLY place in this file where an entity id is written down.
# input_text entity ids are derived from the KEY, so these stay stable:
#   input_text.ems_src_grid, input_text.ems_src_solar, ...
input_text:
  ems_src_grid:
    name: EMS source - grid meter (primary)
    icon: mdi:transmission-tower
  ems_src_grid_backup:
    name: EMS source - grid meter (backup)
    icon: mdi:transmission-tower-import
  ems_src_solar:
    name: EMS source - PV power (all inverters)
    icon: mdi:solar-power
  ems_src_house_load:
    name: EMS source - house consumption (optional)
    icon: mdi:home-lightning-bolt-outline
  ems_src_batt_soc:
    name: EMS source - battery SoC
    icon: mdi:battery-50
  ems_src_batt_power:
    name: EMS source - battery power (+ charging)
    icon: mdi:battery-charging
  ems_src_batt_voltage:
    name: EMS source - battery voltage
    icon: mdi:sine-wave
  ems_src_batt_current:
    name: EMS source - battery current (+ charging)
    icon: mdi:current-dc
  ems_src_inv1_limit:
    name: EMS source - inverter 1 limit
    icon: mdi:solar-panel
  ems_src_inv2_limit:
    name: EMS source - inverter 2 limit
    icon: mdi:solar-panel
  ems_src_inv3_limit:
    name: EMS source - inverter 3 limit
    icon: mdi:solar-panel
  ems_src_inv1_power:
    name: EMS source - inverter 1 power
    icon: mdi:flash
  ems_src_inv2_power:
    name: EMS source - inverter 2 power
    icon: mdi:flash
  ems_src_inv3_power:
    name: EMS source - inverter 3 power
    icon: mdi:flash
  ems_src_victron_state:
    name: EMS source - Victron charge stage
    icon: mdi:battery-sync
# =============================================================================


# =============================================================================
# 2) HELPERS (created automatically by this file)
# =============================================================================
input_boolean:
  ems_enabled:
    name: EMS enabled
    icon: mdi:transmission-tower-export
    initial: true
  # ON (default) = the loop regulates by itself. OFF = manual override: "EMS
  # manual limit" is written to all inverters, every sensor is ignored, the
  # charge-allowance learning is frozen and the watchdog stands down.
  # A switch instead of the old "-1" sentinel, so the manual percentage is a
  # plain 0..100 value (0 = inverters off).
  ems_automatic:
    name: EMS automatic mode
    icon: mdi:auto-mode
    initial: true
  # THE DAY-START OPEN PHASE (the "morning" latch, NOTES N). ON = the array is
  # held fully open at 100 %. Armed by automation.opendtu_ems_day_start at
  # sunrise (or when the mode becomes FULL), RELEASED by the control loop as soon as
  # there is something to throttle: the array reaches "EMS open until solar", the
  # battery charges at its calculated maximum, an export appears, or the SoC stop
  # is reached. It is a STATE, not a setting - switching it on by hand opens the
  # array until one of those is true.
  ems_open_phase:
    name: EMS day-start open phase
    icon: mdi:weather-sunset-up
  ems_simulate_battery_loss:
    name: EMS test - simulate battery loss
    icon: mdi:battery-off-outline
  ems_verbose:
    name: EMS verbose logging
    icon: mdi:script-text-play-outline
  # Dashboard switch, not read by the control loop: OFF (default) keeps the
  # ready-made dashboards free of tuning controls; ON reveals the expert card
  # with every adjustable parameter. The tuning helpers are always reachable
  # under Settings > Devices & services > Helpers regardless of this switch.
  ems_expert_mode:
    name: EMS expert mode
    icon: mdi:wrench-cog-outline

input_number:
  # The limit written to all inverters while "EMS automatic mode" is OFF.
  # Ignored (and harmless) while automatic mode is on; 0 = inverters off.
  ems_manual_pct:
    name: EMS manual limit
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:hand-back-right-outline
  # The grid target: the loop aims at this many watts of IMPORT by SUBTRACTING
  # it from the PV target (section 3), so the grid never sits exactly on the
  # export boundary. Raising it therefore lets the array produce LESS.
  ems_grid_bias:
    name: EMS grid bias
    min: 0
    max: 200
    step: 5
    mode: box
    unit_of_measurement: W
    icon: mdi:transmission-tower
  # only write when the percentage changes by at least this much
  ems_hysteresis_pct:
    name: EMS hysteresis
    min: 0
    max: 10
    step: 0.5
    mode: box
    unit_of_measurement: "%"
    icon: mdi:water-percent
  # max charge power of the battery in W (50 A x ~50 V).
  # This is the HARD CEILING and the fallback. The charge power the loop really
  # offers is  battery voltage x "EMS max charge current"  (see below), capped
  # at this value, so the limit follows the pack voltage.
  ems_max_charge_power:
    name: EMS max charge power
    min: 0
    max: 6000
    step: 100
    mode: box
    unit_of_measurement: W
    icon: mdi:battery-charging-high
  # The charge current limit in amps: min(DVCC max charge current, BMS CCL).
  # The dynamic charge power limit is  battery voltage x this value. With the
  # reference installation (50 A, ~51 V) that is about 2550 W. If the battery
  # voltage sensor is missing, the static "EMS max charge power" is used.
  ems_max_charge_current:
    name: EMS max charge current
    min: 0
    max: 200
    step: 1
    mode: box
    unit_of_measurement: A
    icon: mdi:current-dc
  # DAY-START OPEN PHASE: the array is held at 100 % while the measured PV power
  # is still below this value AND the battery is not yet charging at its
  # calculated maximum (NOTES N). 3500 W is the point where the reference array
  # (1x 1500 W + 2x 1600 W) is at full production, i.e. where throttling can
  # begin. 0 disables the phase; then the EMS starts regulating at day start.
  ems_open_solar_w:
    name: EMS open until solar
    min: 0
    max: 15000
    step: 100
    mode: box
    unit_of_measurement: W
    icon: mdi:weather-sunny
  # Hard stop for the charge offer: at or above this SoC the EMS stops asking
  # the array for charge power and only covers the house load. 100 = never.
  # It counts only while the battery is really NOT charging, so a wrong or
  # stuck SoC value can never cut the array down - that is the job of the
  # charge allowance below (NOTES L).
  ems_soc_stop:
    name: EMS SoC stop charging
    min: 80
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-check-outline
  # The charge power the battery has been OBSERVED to accept, in watts.
  # The control loop lowers it when a lasting export shows that the battery is
  # not taking what it is offered, resets it to "EMS max charge power" whenever
  # the battery discharges, and probes upwards again when there is no export.
  # This is what keeps the array working at the battery's real acceptance
  # instead of at a value the battery cannot use (NOTES L).
  ems_charge_allowance:
    name: EMS charge allowance
    min: 0
    max: 6000
    step: 50
    mode: box
    unit_of_measurement: W
    icon: mdi:battery-sync-outline
  # Internal, written by the loop: the BASELINE of the current export episode.
  # While the battery keeps taking measurably more (> 50 W) it follows the
  # battery up and the export grace restarts, so a still-ramping ESS can never
  # be read as "the battery cannot take the offer" - otherwise the offer is cut
  # before the battery ever reached its charge limit (the reported "solar is set
  # down although the battery is not charging to the limit" failure). Only a
  # charge power that has plateaued below the offer for the whole grace counts.
  # Do not edit (a manual change only re-arms or silences the cut).
  ems_bat_prev:
    name: EMS battery power baseline
    min: -6000
    max: 6000
    step: 1
    mode: box
    unit_of_measurement: W
    icon: mdi:history
  # An export up to this many watts is tolerated: meter noise, the Victron ramp
  # and the upward probe all live in this band. Nothing is curtailed and no
  # allowance is cut inside it.
  ems_export_tolerance:
    name: EMS export tolerance
    min: 0
    max: 1000
    step: 10
    mode: box
    unit_of_measurement: W
    icon: mdi:transmission-tower-off
  # An export above the tolerance that lasts longer than this counts as proof
  # that the battery cannot take the offered charge power -> the allowance is
  # reduced. Give the Victron room: it needs seconds to minutes to ramp.
  ems_export_grace:
    name: EMS export grace
    min: 0
    max: 600
    step: 15
    mode: box
    unit_of_measurement: s
    icon: mdi:timer-alert-outline
  # internal counter: consecutive 15 s ticks with an export above the tolerance
  # (the loop heartbeat). Do not change manually - use "EMS export grace".
  ems_export_ticks:
    name: EMS export ticks
    min: 0
    max: 99
    step: 1
    mode: box
    icon: mdi:counter
  # after this long without an export the allowance is probed upwards again, so
  # a battery that freed up (BMS released the current limit, pack warmed up,
  # CV phase over) is charged at full power again by itself
  ems_reprobe_seconds:
    name: EMS charge re-probe
    min: 60
    max: 3600
    step: 60
    mode: box
    unit_of_measurement: s
    icon: mdi:arrow-up-bold-outline
  # GRID_BLIND mode / watchdog: 0 % stops the inverters (export impossible).
  # Raise to 2 % if your inverters become unstable at 0 %.
  ems_failsafe_pct:
    name: EMS fail-safe limit
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:shield-alert-outline
  # allowed difference between the two grid meters before the more conservative
  # one is used. Small permanent offsets (metering point, tolerance) are normal.
  ems_meter_tolerance:
    name: EMS meter tolerance
    min: 0
    max: 1000
    step: 10
    mode: box
    unit_of_measurement: W
    icon: mdi:scale-balance
  # Victron ramp: after every write the loop waits this long before it acts
  # again, so it does not chase an ESS that is still ramping. Keep it below the
  # 15 s heartbeat, otherwise corrections wait for the next heartbeat.
  ems_settle_seconds:
    name: EMS settle time
    min: 0
    max: 120
    step: 1
    mode: box
    unit_of_measurement: s
    icon: mdi:timer-sand
  # maximum increase of the limit per write, in percent of the total capacity.
  # Prevents an export burst while the ESS has not started charging yet.
  ems_max_step_pct:
    name: EMS max step
    min: 1
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:stairs-up
  # internal counter for the delivery check (consecutive short readings).
  # Do not change manually unless you want to silence the notification.
  ems_delivery_short:
    name: EMS delivery short count
    min: 0
    max: 9
    step: 1
    mode: box
    icon: mdi:counter
  # after a Home Assistant start nothing is written for this long, so the
  # sensors can deliver their first values and the ESS can finish booting.
  # Raise it if your Victron needs longer than 2 minutes to come up.
  ems_start_grace:
    name: EMS start grace
    min: 0
    max: 900
    step: 10
    mode: box
    unit_of_measurement: s
    icon: mdi:timer-play-outline

input_datetime:
  ems_last_apply:
    name: EMS last limit write
    has_date: true
    has_time: true
  # written by automation.opendtu_ems_boot at every Home Assistant start
  ems_started_at:
    name: EMS started at
    has_date: true
    has_time: true


# =============================================================================
# 3) SENSORS
# =============================================================================
template:
  - sensor:
      # --- what the mapping points at --------------------------------------
      # One stable EMS entity per mapped sensor, so neither the control law nor
      # a dashboard ever has to know a foreign entity id again.
      # CONTRACT: a sensor with a unit_of_measurement/state_class must render a
      # NUMBER - Home Assistant rejects a string state there ("the state template
      # must not render to a string, including unknown or unavailable"). Hence
      # the `float(0)` in the state and the `is_number` in the availability,
      # which suppresses the render while the entry is empty or the sensor has
      # no numeric value. Both together are what the HA docs prescribe for this
      # pattern; without them a gap in the mapping costs a warning per update.
      - name: "EMS solar power"
        unique_id: ems_solar_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:solar-power
        availability: >-
          {%- set s = states('input_text.ems_src_solar') or '' -%}
          {{- s != '' and has_value(s) and is_number(states(s)) -}}
        state: >-
          {%- set s = states('input_text.ems_src_solar') or '' -%}
          {{- states(s) | float(0) -}}
      - name: "EMS battery SoC"
        unique_id: ems_battery_soc
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        icon: mdi:battery-50
        availability: >-
          {%- set s = states('input_text.ems_src_batt_soc') or '' -%}
          {{- s != '' and has_value(s) and is_number(states(s)) -}}
        state: >-
          {%- set s = states('input_text.ems_src_batt_soc') or '' -%}
          {{- states(s) | float(0) -}}
      - name: "EMS battery power"
        unique_id: ems_battery_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:battery-charging
        availability: >-
          {%- set s = states('input_text.ems_src_batt_power') or '' -%}
          {{- s != '' and has_value(s) and is_number(states(s)) -}}
        state: >-
          {%- set s = states('input_text.ems_src_batt_power') or '' -%}
          {{- states(s) | float(0) -}}
      - name: "EMS battery voltage"
        unique_id: ems_battery_voltage
        unit_of_measurement: V
        device_class: voltage
        state_class: measurement
        icon: mdi:sine-wave
        availability: >-
          {%- set s = states('input_text.ems_src_batt_voltage') or '' -%}
          {{- s != '' and has_value(s) and is_number(states(s)) -}}
        state: >-
          {%- set s = states('input_text.ems_src_batt_voltage') or '' -%}
          {{- states(s) | float(0) -}}
      - name: "EMS battery current"
        unique_id: ems_battery_current
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        icon: mdi:current-dc
        availability: >-
          {%- set s = states('input_text.ems_src_batt_current') or '' -%}
          {{- s != '' and has_value(s) and is_number(states(s)) -}}
        state: >-
          {%- set s = states('input_text.ems_src_batt_current') or '' -%}
          {{- states(s) | float(0) -}}

      # --- the mapping itself ----------------------------------------------
      # "ok" once every REQUIRED entry is filled. Until then the loop cannot
      # read a single sensor, so this is the first thing to look at after an
      # install or an update - see the blueprint "OpenDTU EMS - the sensor names".
      - name: "EMS map status"
        unique_id: ems_map_status
        icon: mdi:map-marker-question-outline
        attributes:
          # filled in = the helper holds an entity id (readability is the mode
          # ladder's job: a mapped but missing sensor shows up as GRID_BLIND /
          # NO_BATTERY, a wrong id must not be silent)
          required_missing: >-
            {%- set unset = ['', 'unknown', 'unavailable', 'none'] -%}
            {%- set ns = namespace(out=[]) -%}
            {%- for role, key in [('grid', 'ems_src_grid'),
                                  ('solar', 'ems_src_solar'),
                                  ('batt_soc', 'ems_src_batt_soc'),
                                  ('batt_power', 'ems_src_batt_power'),
                                  ('inv1_limit', 'ems_src_inv1_limit'),
                                  ('inv2_limit', 'ems_src_inv2_limit'),
                                  ('inv3_limit', 'ems_src_inv3_limit')]
                if (states('input_text.' ~ key) | string | lower) in unset -%}
              {%- set ns.out = ns.out + [role] -%}
            {%- endfor -%}
            {{ ns.out }}
          optional_empty: >-
            {%- set unset = ['', 'unknown', 'unavailable', 'none'] -%}
            {%- set ns = namespace(out=[]) -%}
            {%- for role, key in [('grid_backup', 'ems_src_grid_backup'),
                                  ('house_load', 'ems_src_house_load'),
                                  ('batt_voltage', 'ems_src_batt_voltage'),
                                  ('batt_current', 'ems_src_batt_current'),
                                  ('inv1_power', 'ems_src_inv1_power'),
                                  ('inv2_power', 'ems_src_inv2_power'),
                                  ('inv3_power', 'ems_src_inv3_power'),
                                  ('victron_state', 'ems_src_victron_state')]
                if (states('input_text.' ~ key) | string | lower) in unset -%}
              {%- set ns.out = ns.out + [role] -%}
            {%- endfor -%}
            {{ ns.out }}
        state: >-
          {#- a plain `set` inside a for-loop does NOT survive the loop in
              Jinja, so this needs a namespace (the bug was: always "ok") -#}
          {%- set unset = ['', 'unknown', 'unavailable', 'none'] -%}
          {%- set ns = namespace(missing=0) -%}
          {%- for key in ['ems_src_grid', 'ems_src_solar', 'ems_src_batt_soc',
                          'ems_src_batt_power', 'ems_src_inv1_limit',
                          'ems_src_inv2_limit', 'ems_src_inv3_limit']
              if (states('input_text.' ~ key) | string | lower) in unset -%}
            {%- set ns.missing = ns.missing + 1 -%}
          {%- endfor -%}
          {%- if ns.missing == 0 -%}ok
          {%- else -%}{{ ns.missing }} required source{{ 's' if ns.missing > 1 }} missing
          {%- endif -%}

      # --- resolved grid power ---------------------------------------------
      # the two meters of the mapping (ems_src_grid / ems_src_grid_backup).
      # A meter counts as usable when it has a value and was updated in the
      # last 5 minutes.
      # Both alive + differing by more than the tolerance -> take the SMALLER
      # value (the one showing more export): erring towards less PV can never
      # cause an export. "source" shows what is in use.
      - name: "EMS grid power"
        unique_id: ems_grid_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:transmission-tower
        availability: >-
          {%- set s = states('input_text.ems_src_grid') -%}
          {%- set v = states('input_text.ems_src_grid_backup') -%}
          {{- (has_value(s) and (now() - states[s].last_updated).total_seconds() < 300)
              or (has_value(v) and (now() - states[v].last_updated).total_seconds() < 300) -}}
        attributes:
          source: >-
            {%- set s = states('input_text.ems_src_grid') -%}
            {%- set v = states('input_text.ems_src_grid_backup') -%}
            {%- set tol = states('input_number.ems_meter_tolerance') | float(100) -%}
            {%- set s_ok = has_value(s) and (now() - states[s].last_updated).total_seconds() < 300 -%}
            {%- set v_ok = has_value(v) and (now() - states[v].last_updated).total_seconds() < 300 -%}
            {%- if s_ok and v_ok -%}
              {{- 'disagree' if (((states(s) | float(0)) - (states(v) | float(0))) | abs) > tol else 'shelly' -}}
            {%- elif s_ok -%}shelly
            {%- elif v_ok -%}victron
            {%- else -%}none{%- endif -%}
          shelly: "{{ states(states('input_text.ems_src_grid')) }}"
          victron: "{{ states(states('input_text.ems_src_grid_backup')) }}"
        state: >-
          {%- set s = states('input_text.ems_src_grid') -%}
          {%- set v = states('input_text.ems_src_grid_backup') -%}
          {%- set tol = states('input_number.ems_meter_tolerance') | float(100) -%}
          {%- set s_ok = has_value(s) and (now() - states[s].last_updated).total_seconds() < 300 -%}
          {%- set v_ok = has_value(v) and (now() - states[v].last_updated).total_seconds() < 300 -%}
          {%- set s_val = states(s) | float(0) -%}
          {%- set v_val = states(v) | float(0) -%}
          {%- set disagree = s_ok and v_ok and (((s_val - v_val) | abs) > tol) -%}
          {%- set val = ([s_val, v_val] | min) if disagree else (s_val if s_ok else v_val) -%}
          {{ val | round(0) | int(0) }}

      # --- operating mode ---------------------------------------------------
      #   OFF         kill switch off
      #   STARTING    less than "EMS start grace" since Home Assistant started:
      #               waiting for the first sensor values and for the ESS
      #   NIGHT       sun down and no PV: standby, nothing to control
      #   DTU_BLIND   no inverter entity readable at all (OpenDTU off, MQTT
      #               down, ids changed) -> nothing to control, nothing written
      #   GRID_BLIND  no usable grid reading or no solar reading inside the
      #               control interval (both grid meters dead/stale, or the
      #               OpenDTU power sensor gone) -> cannot compute the house
      #               load -> fail-safe limit
      #   NO_BATTERY  no usable battery data -> pure zero export (no charge push)
      #   FULL        everything fresh -> house load + allowed charge power - bias
      #               (a small IMPORT, so it never exports)
      #               (also when only the BACKUP grid meter is available)
      - name: "EMS mode"
        unique_id: ems_mode
        icon: mdi:state-machine
        state: >-
          {%- set soc = 'sensor.ems_battery_soc' -%}
          {%- set bp = 'sensor.ems_battery_power' -%}
          {#- one source of truth: sensor.ems_grid_power handles both meters
              and is only unavailable when neither of them is usable -#}
          {%- set grid_ok = has_value('sensor.ems_grid_power') -%}
          {%- set solar_ok = has_value('sensor.ems_solar_power') -%}
          {#- the capacity sensor is 0 when no inverter limit entity is readable -#}
          {%- set cap = states('sensor.ems_inverter_capacity') | float(0) -%}
          {#- sun down and no PV: the inverters sleep, nothing to do -#}
          {%- set night = is_state('sun.sun', 'below_horizon')
                          and (states('sensor.ems_solar_power') | float(0)) < 200 -%}
          {#- after a Home Assistant start: wait before touching anything -#}
          {%- set started = state_attr('input_datetime.ems_started_at', 'timestamp') | float(0) -%}
          {%- set starting = started > 0
                            and (now().timestamp() - started)
                                < (states('input_number.ems_start_grace') | float(120)) -%}
          {%- set batt_ok = has_value(soc) and has_value(bp)
                            and (states(soc) | float(-1)) >= 0 and (states(soc) | float(-1)) <= 100
                            and (now() - states[bp].last_updated).total_seconds() < 120
                            and (now() - states[soc].last_updated).total_seconds() < 300 -%}
          {%- if not is_state('input_boolean.ems_enabled', 'on') -%}OFF
          {%- elif starting -%}STARTING
          {%- elif night -%}NIGHT
          {%- elif cap == 0 -%}DTU_BLIND
          {%- elif not solar_ok or not grid_ok -%}GRID_BLIND
          {%- elif not batt_ok or is_state('input_boolean.ems_simulate_battery_loss', 'on') -%}NO_BATTERY
          {%- else -%}FULL{%- endif -%}

      # --- inverter capacity / redistribution -------------------------------
      # The three limit entities come from the mapping (ems_src_inv1_limit ..
      # ems_src_inv3_limit). An inverter whose limit entity is unavailable
      # (offline, radio lost) - or that is not mapped at all - is excluded here,
      # so its share goes to the remaining inverters: they are driven to a
      # higher percentage (up to 100 % each) for the same total. "active" and
      # "current_pct" expose what the loop actually sees. The watt ratings are
      # the inverter nameplate values - change them for a different fleet.
      - name: "EMS inverter capacity"
        unique_id: ems_inverter_capacity
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:solar-power-variant
        attributes:
          active: >-
            {%- set ids = [states('input_text.ems_src_inv1_limit'),
                           states('input_text.ems_src_inv2_limit'),
                           states('input_text.ems_src_inv3_limit')] -%}
            {%- set ns = namespace(n=0) -%}
            {%- for e in ids if e and has_value(e) -%}
              {%- set ns.n = ns.n + 1 -%}
            {%- endfor -%}
            {{ ns.n }}
          current_pct: >-
            {%- set ids = [states('input_text.ems_src_inv1_limit'),
                           states('input_text.ems_src_inv2_limit'),
                           states('input_text.ems_src_inv3_limit')] -%}
            {%- set ns = namespace(v=-1) -%}
            {%- for e in ids if ns.v < 0 and e and has_value(e) -%}
              {%- set f = states(e) | float(-1) -%}
              {%- if f >= 0 -%}{%- set ns.v = f -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.v }}
        state: >-
          {%- set caps = [(states('input_text.ems_src_inv1_limit'), 1500),
                          (states('input_text.ems_src_inv2_limit'), 1600),
                          (states('input_text.ems_src_inv3_limit'), 1600)] -%}
          {%- set ns = namespace(cap=0) -%}
          {%- for e, c in caps if e and has_value(e) -%}
            {%- set ns.cap = ns.cap + c -%}
          {%- endfor -%}
          {{ ns.cap }}

      # --- PV delivery check -------------------------------------------------
      # expected output = commanded percentage x reachable capacity.
      # A ratio well below 100 % while the sun is up means an inverter does not
      # deliver although its limit entity is available - it is offline, shaded,
      # or sitting on its own persistent limit. Availability alone cannot see
      # that. The ratio is forced to 100 % below 300 W expected output (low light
      # or a low limit is not a finding) and while the DAY-START OPEN PHASE is
      # active: there the commanded 100 % does not mean "an inverter must deliver
      # 4.7 kW now", it means "nothing is being throttled" - the sun is the limit,
      # so a low reading is a cloud, not a dead inverter.
      - name: "EMS PV delivery"
        unique_id: ems_pv_delivery
        unit_of_measurement: "%"
        icon: mdi:chart-bell-curve-cumulative
        attributes:
          expected_w: >-
            {{- (states('sensor.ems_limit_target') | float(0) / 100
                 * states('sensor.ems_inverter_capacity') | float(0)) | round(0) -}}
          actual_w: "{{ states('sensor.ems_solar_power') }}"
        state: >-
          {%- set cap = states('sensor.ems_inverter_capacity') | float(0) -%}
          {%- set exp = states('sensor.ems_limit_target') | float(0) / 100
                        * states('sensor.ems_inverter_capacity') | float(0) -%}
          {%- set act = states('sensor.ems_solar_power') | float(0) -%}
          {%- if cap == 0 -%}0
          {%- elif exp < 300 -%}100
          {%- elif is_state('input_boolean.ems_open_phase', 'on') -%}100
          {%- else -%}{{ ((act / exp) * 100) | round(0) }}{%- endif -%}

      # --- house load --------------------------------------------------------
      # DISPLAY ONLY - the control law never reads this (it computes
      # solar + grid + charge push - bias directly), so a wrong or missing house
      # load cannot affect the regulation.
      # Two sources, in this order:
      #   1. ems_src_house_load - your own consumption sensor, if you mapped one
      #      (it may be derived differently, e.g. from the inverter or a meter)
      #   2. the energy balance at the metering point (grid + solar = load +
      #      battery charge):  solar + grid - battery_power, battery signed
      #      (positive = charging). Handy as a sanity check: if this value ever
      #      looks odd while a mapped sensor looks right, one of the three
      #      measurements is wrong.
      # The "source" attribute says which one is in use.
      - name: "EMS house load"
        unique_id: ems_house_load
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:home-lightning-bolt-outline
        availability: >-
          {%- set src = states('input_text.ems_src_house_load') or '' -%}
          {{- (src != '' and has_value(src)) or
              (has_value('sensor.ems_grid_power')
               and has_value('sensor.ems_solar_power')
               and has_value('sensor.ems_battery_power')) -}}
        attributes:
          source: >-
            {%- set src = states('input_text.ems_src_house_load') or '' -%}
            {{- 'mapped sensor' if (src != '' and has_value(src)) else 'calculated' -}}
        state: >-
          {%- set src = states('input_text.ems_src_house_load') or '' -%}
          {%- if src != '' and has_value(src) and is_number(states(src)) -%}
            {{ states(src) | float(0) | round(0) | int(0) }}
          {%- else -%}
            {%- set grid = states('sensor.ems_grid_power') | float(0) -%}
            {%- set solar = states('sensor.ems_solar_power') | float(0) -%}
            {%- set bat = states('sensor.ems_battery_power') | float(0) -%}
            {{ (solar + grid - bat) | round(0) | int(0) }}
          {%- endif -%}

      # --- battery charge power (dynamic) -----------------------------------
      # The Seplos BMS publishes a power value; the Victron publishes the DC bus
      # voltage and the SIGNED battery current. Their product is the momentary
      # battery power and it is the value the control law works with:
      #   * positive = charging   -> this is the power the array has to serve
      #   * negative = discharging -> the battery is NOT the bottleneck; a
      #     discharge must never be read as "the battery cannot take power" and
      #     must never curtail the array
      # While the Victron pair is not readable (missing sensor, integration
      # restart) the Seplos power is used, so the package keeps working without
      # the Victron sensors.
      - name: "EMS battery charge power"
        unique_id: ems_battery_charge_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:battery-arrow-up-outline
        availability: >-
          {{- (has_value('sensor.ems_battery_voltage')
               and has_value('sensor.ems_battery_current'))
              or has_value('sensor.ems_battery_power') -}}
        attributes:
          source: >-
            {{- 'victron (V x I)' if (has_value('sensor.ems_battery_voltage')
                 and has_value('sensor.ems_battery_current')) else 'seplos' -}}
          voltage: "{{ states('sensor.ems_battery_voltage') }}"
          current: "{{ states('sensor.ems_battery_current') }}"
        state: >-
          {%- set v = 'sensor.ems_battery_voltage' -%}
          {%- set i = 'sensor.ems_battery_current' -%}
          {%- if has_value(v) and has_value(i) -%}
            {{ (states(v) | float(0) * states(i) | float(0)) | round(0) | int(0) }}
          {%- else -%}
            {#- the mirror renders a number, and this sensor has a unit too -#}
            {{ states('sensor.ems_battery_power') | float(0) }}
          {%- endif -%}

      # --- dynamic charge power limit ---------------------------------------
      # battery voltage x "EMS max charge current" (DVCC / BMS CCL). The static
      # "EMS max charge power" stays the hard ceiling, so a tuned value is never
      # exceeded by surprise, and it is also the fallback when the voltage
      # sensor is missing - the behaviour then is exactly the pre-1.9 one.
      - name: "EMS charge power limit"
        unique_id: ems_charge_power_limit
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:battery-charging-high
        availability: >-
          {{- has_value('input_number.ems_max_charge_power') -}}
        attributes:
          dynamic: "{{ has_value('sensor.ems_battery_voltage') }}"
          voltage: "{{ states('sensor.ems_battery_voltage') }}"
          current_limit: "{{ states('input_number.ems_max_charge_current') }}"
        state: >-
          {%- set hard = states('input_number.ems_max_charge_power') | float(0) -%}
          {%- set v = 'sensor.ems_battery_voltage' -%}
          {%- set amps = states('input_number.ems_max_charge_current') | float(0) -%}
          {%- if has_value(v) and amps > 0 -%}
            {{ [((states(v) | float(0)) * amps) | round(0) | int(0),
                hard | round(0) | int(0)] | min }}
          {%- else -%}
            {{ hard | round(0) | int(0) }}
          {%- endif -%}

      # --- limit percentage to write (single source of truth) ---------------
      # BATTERY FIRST - and never on the back of a momentary export:
      #   FULL        PV = house load + battery charge power - bias
      #                  = solar + grid + (allowance - battery power) - bias
      #               "bias" is SUBTRACTED on purpose: the loop aims at
      #               "EMS grid bias" watts of grid IMPORT, so the steady state
      #               is a small import and not a small export. Until 1.6.0 the
      #               sign was the other way round, which made the loop hold a
      #               permanent export of the same size (raising the bias made
      #               that export bigger).
      #               "allowance" = min(EMS max charge power, EMS charge
      #               allowance): the configured maximum, capped by the power
      #               the battery has been OBSERVED to accept. The measured
      #               export does not appear in this formula, so a Victron that
      #               is still ramping, a load switching off or a lagging meter
      #               can no longer curtail the array. The array is only cut
      #               when the battery really cannot take the power - which is
      #               what the allowance learning in the control loop detects
      #               (NOTES section L).
      #   NO_BATTERY  PV = house load + battery - bias (= solar + grid - bias)
      #   GRID_BLIND  fail-safe percentage             (export impossible)
      # The SoC stops the charge offer only at "EMS SoC stop charging" AND only
      # while the battery is really not charging, so a wrong or stuck SoC value
      # can never cut the array down.
      # Increases are rate limited ("EMS max step") so the array does not run
      # ahead of the ESS; decreases are applied immediately (less PV can never
      # cause an export).
      - name: "EMS limit target"
        unique_id: ems_limit_target
        unit_of_measurement: "%"
        icon: mdi:speedometer
        attributes:
          mode: "{{ states('sensor.ems_mode') }}"
          grid: "{{ states('sensor.ems_grid_power') }}"
          solar: "{{ states('sensor.ems_solar_power') }}"
          active: "{{ state_attr('sensor.ems_inverter_capacity', 'active') }}"
          capacity: "{{ states('sensor.ems_inverter_capacity') }}"
          # what the battery may take right now (display only)
          allowance: >-
            {%- set cmax = states('sensor.ems_charge_power_limit') | float(0) -%}
            {%- set cmax = (states('input_number.ems_max_charge_power') | float(2500))
                           if cmax <= 0 else cmax -%}
            {{- [cmax, states('input_number.ems_charge_allowance')
                 | float(cmax)] | min | round(0) | int(0) -}}
          # how much charge power the state above asks the array for
          charge_push: >-
            {%- set cmax = states('sensor.ems_charge_power_limit') | float(0) -%}
            {%- set cmax = (states('input_number.ems_max_charge_power') | float(2500))
                           if cmax <= 0 else cmax -%}
            {%- set allow = [cmax, states('input_number.ems_charge_allowance')
                                   | float(cmax)] | min -%}
            {%- set bat = states('sensor.ems_battery_charge_power') | float(0) -%}
            {%- set soc = states('sensor.ems_battery_soc') | float(0) -%}
            {%- set tol = states('input_number.ems_export_tolerance') | float(150) -%}
            {%- set stop = (states('sensor.ems_mode') == 'FULL'
                            and soc >= (states('input_number.ems_soc_stop') | float(100))
                            and bat < tol) -%}
            {{ 0 if stop else ([allow - bat, 0] | max | round(0) | int(0)) }}
          # the day-start open phase (NOTES N): "on" = the array is deliberately
          # wide open, so 100 % is not a command but "nothing to throttle yet"
          open_phase: "{{ 'on' if is_state('input_boolean.ems_open_phase', 'on') else 'off' }}"
          open_until: >-
            {%- set w = states('input_number.ems_open_solar_w') | float(3500) -%}
            {%- if w <= 0 -%}disabled
            {%- else -%}{{ w | round(0) | int(0) }} W PV, battery at maximum, or any export
            {%- endif -%}
        state: >-
          {%- set cap = states('sensor.ems_inverter_capacity') | float(0) -%}
          {%- set cur = state_attr('sensor.ems_inverter_capacity', 'current_pct') | float(-1) -%}
          {%- set mode = states('sensor.ems_mode') -%}
          {%- set auto = is_state('input_boolean.ems_automatic', 'on') -%}
          {%- set manual = states('input_number.ems_manual_pct') | float(0) -%}
          {%- set grid = states('sensor.ems_grid_power') | float(0) -%}
          {%- set solar = states('sensor.ems_solar_power') | float(0) -%}
          {%- set bias = states('input_number.ems_grid_bias') | float(20) -%}
          {#- a manual override wins over every sensor, including the fail-safe -#}
          {%- if not auto -%}
            {{ [[manual, 0] | max, 100] | min }}
          {%- elif mode in ['GRID_BLIND', 'OFF'] or cap == 0 -%}
            {{ states('input_number.ems_failsafe_pct') | float(0) }}
          {%- else -%}
            {#- the battery power: derived from the Victron DC bus (voltage x
                SIGNED current) when it is readable, otherwise the Seplos BMS
                power. Signed - positive = charging. -#}
            {%- set soc = states('sensor.ems_battery_soc') | float(0) -%}
            {%- set cp = 'sensor.ems_battery_charge_power' -%}
            {%- set bat = (states(cp) | float(0)) if has_value(cp)
                           else (states('sensor.ems_battery_power') | float(0)) -%}
            {#- the maximum charge power: battery voltage x charge current limit,
                falling back to the static helper (also the ceiling) -#}
            {%- set cmax = states('sensor.ems_charge_power_limit') | float(0) -%}
            {%- set cmax = (states('input_number.ems_max_charge_power') | float(2500))
                           if cmax <= 0 else cmax -%}
            {%- set tol = states('input_number.ems_export_tolerance') | float(150) -%}
            {#- SoC stop, honoured only while the battery really takes nothing, so
                a wrong SoC cannot cut the array -#}
            {%- set stopped = (soc >= (states('input_number.ems_soc_stop') | float(100))
                               and bat < tol) -%}
            {#- DAY-START OPEN PHASE (NOTES N): at dawn the array is held wide open
                instead of being trimmed to "house load + charge need", so no PV is
                thrown away while there is nothing to throttle. All release tests
                are evaluated HERE, in the same render as the state, so the phase
                can never lag a write:
                  * real PV at full production  -> throttling is possible again
                  * battery at its calculated maximum -> no headroom left to soak
                    up PV, so anything above the house load would have to export
                  * any export -> the hard guard, the phase may never be the
                    REASON for an export. The test is the loop's export tick
                    counter, not a momentary reading: the ticks are reset while
                    the battery is still rampING (lrn_rising), so a load
                    switching off or the ESS catching up - the transients "EMS
                    export tolerance" and "EMS export grace" exist for - does
                    not end the phase. Two consecutive ticks (~30 s) of an
                    export the battery is NOT catching up with are required,
                    the same evidence the allowance learning waits for, only
                    shorter: the phase must not run wide open for a minute.
                  * SoC stop reached with the battery taking nothing
                Re-entry is prevented by the latch itself (the control loop clears
                it), otherwise the limit would cycle between 100 % and the
                regulated value at every export. -#}
            {%- set open = (mode == 'FULL'
                            and is_state('input_boolean.ems_open_phase', 'on')
                            and not stopped
                            and (states('input_number.ems_export_ticks') | float(0)) < 2
                            and solar < (states('input_number.ems_open_solar_w') | float(3500))
                            and bat < cmax - tol) -%}
            {%- set push = namespace(w=0) -%}
            {%- if mode == 'FULL' -%}
              {#- the offer: the dynamic maximum, capped by what the battery has
                  been observed to accept (EMS charge allowance). The clamped push
                  term means the array is never asked for LESS than the battery is
                  already taking, so a latched-down allowance cannot starve the
                  charge - and lrn_rising keeps it from latching during an ESS
                  ramp in the first place. -#}
              {%- set allow = [cmax, states('input_number.ems_charge_allowance')
                                     | float(cmax)] | min -%}
              {%- set push.w = 0 if stopped else [allow - bat, 0] | max -%}
            {%- endif -%}
            {%- set target = [[solar + grid + push.w - bias, 0] | max, cap] | min -%}
            {%- set pct = (100 if open else target / cap * 100) -%}
            {%- set step = states('input_number.ems_max_step_pct') | float(10) -%}
            {#- the open phase is allowed to jump: it is a deliberate "run the array
                wide open while nothing is throttled" and the sun itself ramps the
                power. Every other increase is rate limited. -#}
            {%- if cur >= 0 and pct > cur and not open -%}
              {{ [pct, cur + step] | min | round(1) }}
            {%- else -%}
              {{ pct | round(1) }}
            {%- endif -%}
          {%- endif -%}

  - binary_sensor:
      # on ONLY for the fail-safe modes - a problem, not a "not ideal" state:
      # DTU_BLIND (no inverter reachable), GRID_BLIND (no usable grid or solar
      # reading) and NO_BATTERY (battery data gone). FULL, STARTING, NIGHT and
      # OFF are normal or deliberate and stay silent.
      # WHICH grid meter the loop uses is NOT a fault: it works with either
      # meter and takes the more conservative value when the two disagree. That
      # is reported in the attributes below and in the "source" attribute of
      # sensor.ems_grid_power. Before 1.8.0 a fallback to the backup meter, or a
      # permanent offset between the two metering points, kept this sensor on
      # the whole day although the system regulated normally.
      - name: "EMS degraded"
        unique_id: ems_degraded
        device_class: problem
        icon: mdi:alert-outline
        attributes:
          mode: "{{ states('sensor.ems_mode') }}"
          grid_source: "{{ state_attr('sensor.ems_grid_power', 'source') }}"
          # true while the loop regulates on the backup meter or on two meters
          # that disagree - worth a look, but not a problem
          grid_fallback: >-
            {{- states('sensor.ems_mode') == 'FULL'
                and state_attr('sensor.ems_grid_power', 'source') in ['victron', 'disagree'] -}}
        state: >-
          {{- states('sensor.ems_mode') not in ['FULL', 'OFF', 'NIGHT', 'STARTING'] -}}

      # ---------------------------------------------------------------------
      # the two DIAGNOSTIC flags below were hand-made sensors in a `template:`
      # block of the reference installation (see NOTES M). They are carried over
      # UNCHANGED in name and behaviour so nothing that used them has to change,
      # but they are now built from the EMS entities - no foreign entity id, no
      # hand-made YAML. Neither of them takes part in the control law.
      # ---------------------------------------------------------------------

      # --- "the grid is exporting, something should throttle" --------------
      # on while the grid exports more than the allowance of the moment:
      #   150 W from 90 % SoC (less headroom in the pack -> react earlier),
      #   200 W below that. Hysteresis: once on it stays on until the grid is
      #   back to -50 W, so it does not chatter around the threshold.
      # The delay matches the threshold (30 s / 60 s). No unique_id: this entity
      # existed before without one, and adding one now would create a duplicate.
      - name: "Grid Export Throttling Required"
        device_class: problem
        icon: mdi:transmission-tower-off
        delay_on: >-
          {{ '00:00:30' if (states('sensor.ems_battery_soc') | float(100)) >= 90
             else '00:01:00' }}
        attributes:
          grid: "{{ states('sensor.ems_grid_power') }}"
          soc: "{{ states('sensor.ems_battery_soc') }}"
          threshold: >-
            {{- 150 if (states('sensor.ems_battery_soc') | float(100)) >= 90 else 200 -}}
          release_at: -50
          # what the loop is doing about it (NOTES L): the charge power the
          # battery takes, what the array is asked to push and what the battery
          # was observed to accept
          battery: "{{ states('sensor.ems_battery_charge_power') }}"
          allowance: "{{ state_attr('sensor.ems_limit_target', 'allowance') }}"
          charge_push: "{{ state_attr('sensor.ems_limit_target', 'charge_push') }}"
          mode: "{{ states('sensor.ems_mode') }}"
        state: >-
          {%- set soc = states('sensor.ems_battery_soc') | float(100) -%}
          {%- set grid = states('sensor.ems_grid_power') | float(0) -%}
          {%- set limit = 150 if soc >= 90 else 200 -%}
          {{- (grid < -50) if this.state == 'on' else (grid < -limit) -}}

      # --- "the house is drawing a lot while the battery takes little" ------
      # on when ALL of: the battery charges less than 1200 W, the grid is not
      # exporting (above -300 W), the house draws more than 1200 W and the pack
      # is below 90 % SoC - i.e. the array's output goes to the house and not
      # into the battery. Purely a mode flag for the user's own automations and
      # for the board; it changes nothing in the loop.
      # The house load comes from sensor.ems_house_load, which itself prefers
      # ems_src_house_load when you mapped your own consumption sensor.
      # Kept as a hand-tuned heuristic: promote the four numbers to helpers if
      # you want to tune them from the UI.
      - name: "High Consumption AC Mode"
        unique_id: high_consumption_ac_mode
        icon: mdi:home-import-outline
        delay_on:
          seconds: 30
        attributes:
          battery: "{{ states('sensor.ems_battery_charge_power') }}"
          grid: "{{ states('sensor.ems_grid_power') }}"
          house_load: "{{ states('sensor.ems_house_load') }}"
          soc: "{{ states('sensor.ems_battery_soc') }}"
          mode: "{{ states('sensor.ems_mode') }}"
        state: >-
          {%- set bat = states('sensor.ems_battery_charge_power') -%}
          {%- set grid = states('sensor.ems_grid_power') -%}
          {%- set load = states('sensor.ems_house_load') -%}
          {%- set soc = states('sensor.ems_battery_soc') -%}
          {%- if 'unavailable' in [bat, grid, load, soc]
                or 'unknown' in [bat, grid, load, soc] -%}
            false
          {%- else -%}
            {{- bat | float < 1200 and grid | float > -300
                and load | float > 1200 and soc | float < 90 -}}
          {%- endif -%}


# =============================================================================
# 4) SCRIPTS - write the limits, and restore the documented defaults
# =============================================================================
script:
  ems_apply:
    alias: "EMS: write inverter limits"
    mode: restart
    fields:
      pct:
        name: Limit
        description: Limit in percent (0-100). Defaults to the EMS limit target sensor.
        required: false
        selector:
          number:
            min: 0
            max: 100
            step: 0.5
            mode: box
    variables:
      value: >-
        {{- pct | default(states('sensor.ems_limit_target'), true) | float(0) | round(1) -}}
      # the write targets come from the mapping. They are read here (not in the
      # step) because a trigger's entity_id cannot be templated - and "entity_id"
      # inside "data" IS rendered, unlike a bare target.
      inv1: "{{ states('input_text.ems_src_inv1_limit') }}"
      inv2: "{{ states('input_text.ems_src_inv2_limit') }}"
      inv3: "{{ states('input_text.ems_src_inv3_limit') }}"
    sequence:
      # heartbeat first: the watchdog must not fire because of a slow DTU
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ems_last_apply
        data:
          timestamp: "{{ now().timestamp() }}"
      # all three in parallel - no 1 s delays, no half-written state. An
      # unmapped inverter is skipped instead of logging an error, so a partial
      # mapping still drives what it can (sensor.ems_map_status reports it).
      # NOTE the guards must render a BOOLEAN: a template condition is false for
      # any other value, so `value_template: "{{ inv1 }}"` (the entity id
      # itself!) silently blocks every write.
      - parallel:
          - if:
              - condition: template
                value_template: "{{ inv1 not in ['', none] }}"
            then:
              - action: number.set_value
                data:
                  entity_id: "{{ inv1 }}"
                  value: "{{ value }}"
                continue_on_error: true
          - if:
              - condition: template
                value_template: "{{ inv2 not in ['', none] }}"
            then:
              - action: number.set_value
                data:
                  entity_id: "{{ inv2 }}"
                  value: "{{ value }}"
                continue_on_error: true
          - if:
              - condition: template
                value_template: "{{ inv3 not in ['', none] }}"
            then:
              - action: number.set_value
                data:
                  entity_id: "{{ inv3 }}"
                  value: "{{ value }}"
                continue_on_error: true

  # The documented defaults of every tuning helper, in one place.
  # WHY THIS EXISTS: Home Assistant creates an input_number that has no
  # "initial" value at its MINIMUM and only restores a value that already
  # exists (see the HA documentation of input_number: with "initial" it starts
  # with that value, otherwise it restores the previous state - and a brand new
  # helper has none). A fresh installation would therefore run with 0 W of
  # charge power and never charge from PV at all.
  # "initial" is NOT the answer here: it would also overwrite your tuning and
  # the learned charge allowance on every Home Assistant restart.
  # automation.opendtu_ems_boot calls this once, on the first start after the
  # install. Run it by hand (Developer tools > Actions) to reset the tuning or
  # to repair an installation whose helpers were created empty by a version
  # before 1.6.0.
  ems_set_defaults:
    alias: "EMS: restore the documented defaults"
    mode: single
    sequence:
      - parallel:
          - action: input_number.set_value
            target:
              entity_id: input_number.ems_manual_pct
            data:
              value: 0
            continue_on_error: true
          - action: input_number.set_value
            target:
              entity_id: input_number.ems_grid_bias
            data:
              value: 20
            continue_on_error: true
          - action: input_number.set_value
            target:
              entity_id: input_number.ems_hysteresis_pct
            data:
              value: 2
            continue_on_error: true
          - action: input_number.set_value
            target:
              entity_id: input_number.ems_max_charge_power
            data:
              value: 2500
            continue_on_error: true
          - action: input_number.set_value
            target:
              entity_id: input_number.ems_max_charge_current
            data:
              value: 50
            continue_on_error: true
          - action: input_number.set_value
            target:
              entity_id: input_number.ems_soc_stop
            data:
              value: 100
            continue_on_error: true
          - action: input_number.set_value
            target:
              entity_id: input_number.ems_charge_allowance
            data:
              value: 2500
            continue_on_error: true
          - action: input_number.set_value
            target:
              entity_id: input_number.ems_bat_prev
            data:
              value: 0
            continue_on_error: true
          - action: input_number.set_value
            target:
              entity_id: input_number.ems_export_tolerance
            data:
              value: 150
            continue_on_error: true
          - action: input_number.set_value
            target:
              entity_id: input_number.ems_export_grace
            data:
              value: 60
            continue_on_error: true
          - action: input_number.set_value
            target:
              entity_id: input_number.ems_export_ticks
            data:
              value: 0
            continue_on_error: true
          - action: input_number.set_value
            target:
              entity_id: input_number.ems_reprobe_seconds
            data:
              value: 900
            continue_on_error: true
          - action: input_number.set_value
            target:
              entity_id: input_number.ems_failsafe_pct
            data:
              value: 0
            continue_on_error: true
          - action: input_number.set_value
            target:
              entity_id: input_number.ems_meter_tolerance
            data:
              value: 100
            continue_on_error: true
          - action: input_number.set_value
            target:
              entity_id: input_number.ems_settle_seconds
            data:
              value: 12
            continue_on_error: true
          - action: input_number.set_value
            target:
              entity_id: input_number.ems_max_step_pct
            data:
              value: 10
            continue_on_error: true
          - action: input_number.set_value
            target:
              entity_id: input_number.ems_delivery_short
            data:
              value: 0
            continue_on_error: true
          - action: input_number.set_value
            target:
              entity_id: input_number.ems_start_grace
            data:
              value: 120
            continue_on_error: true
          - action: input_number.set_value
            target:
              entity_id: input_number.ems_open_solar_w
            data:
              value: 3500
            continue_on_error: true
      # automatic mode is a documented default as well: a reset must never leave
      # the loop sitting in a hand-set manual override
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ems_automatic
        continue_on_error: true
      # the open phase is a STATE, not a setting: a reset leaves it released
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ems_open_phase
        continue_on_error: true
      - action: system_log.write
        data:
          level: info
          logger: opendtu.zero_export
          message: >-
            DEFAULTS: EMS helpers set to the documented values - bias 20 W,
            max charge 2500 W, charge current 50 A, allowance 2500 W,
            tolerance 150 W, grace 60 s, re-probe 900 s, meter tolerance 100 W,
            settle 12 s, max step 10 %, SoC stop 100 %, start grace 120 s,
            open until solar 3500 W, automatic mode on, manual 0 %.


# =============================================================================
# 5) CONTROL LOOP - event driven, with a slow heartbeat
# =============================================================================
automation:
  - id: opendtu_ems_loop
    alias: "OpenDTU EMS loop"
    description: >-
      Battery first: allows the three micro inverters to produce what the house
      load plus the battery charge power needs, and caps the offer at the charge
      power the battery has been observed to accept, so the array is never cut
      while the battery can still take the energy. Degrades to pure zero export
      when battery data is missing. Also learns the real charge acceptance
      ("EMS charge allowance") from a lasting export, and runs at night for that
      (which is when the battery discharges and the estimate is reset).
    mode: restart
    max_exceeded: silent
    triggers:
      - trigger: homeassistant
        event: start
      # react the moment the RESOLVED grid leaves the +/- band (no 20 s
      # polling). sensor.ems_grid_power already arbitrates the two mapped
      # meters, so the trigger needs no entity id of its own - a renamed meter
      # cannot break it any more.
      - trigger: numeric_state
        entity_id: sensor.ems_grid_power
        below: -30
        for: "00:00:05"
      - trigger: numeric_state
        entity_id: sensor.ems_grid_power
        above: 60
        for: "00:00:05"
      # slow heartbeat for drift and for re-asserting the non-persistent limit
      - trigger: time_pattern
        seconds: "/15"
    conditions:
      - condition: state
        entity_id: input_boolean.ems_enabled
        state: "on"
      # nothing to control while Home Assistant is still booting or while no
      # inverter entity is readable - writing would only produce error logs,
      # and the watchdog reports those states separately.
      # NIGHT is deliberately NOT filtered here: the loop still learns the
      # battery's charge acceptance at night (that is when the battery
      # discharges and the estimate is reset) and stops before writing.
      - condition: template
        value_template: >-
          {{ states('sensor.ems_mode') not in ['STARTING', 'DTU_BLIND'] }}
    actions:
      # =====================================================================
      # day-start open phase: RELEASE it first, so the snapshot below (and with
      # it this cycle's write) already works on the regulated value. The release
      # tests are the same as in sensor.ems_limit_target - the sensor stops
      # rendering 100 % the moment one of them is true, this only clears the
      # latch so the phase cannot re-enter at the next export (NOTES N).
      # =====================================================================
      - if:
          - condition: state
            entity_id: input_boolean.ems_open_phase
            state: "on"
          - condition: template
            value_template: >-
              {%- set cmax = states('sensor.ems_charge_power_limit') | float(0) -%}
              {%- set cmax = (states('input_number.ems_max_charge_power') | float(2500))
                             if cmax <= 0 else cmax -%}
              {%- set tol = states('input_number.ems_export_tolerance') | float(150) -%}
              {%- set bat = states('sensor.ems_battery_charge_power') | float(0) -%}
              {%- set soc = states('sensor.ems_battery_soc') | float(0) -%}
              {{- states('sensor.ems_mode') != 'FULL'
                  or (states('sensor.ems_solar_power') | float(0))
                     >= (states('input_number.ems_open_solar_w') | float(3500))
                  or bat >= cmax - tol
                  or (states('input_number.ems_export_ticks') | float(0)) >= 2
                  or (soc >= (states('input_number.ems_soc_stop') | float(100))
                      and bat < tol) -}}
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.ems_open_phase
          - if:
              - condition: state
                entity_id: input_boolean.ems_verbose
                state: "on"
            then:
              - action: system_log.write
                data:
                  level: debug
                  logger: opendtu.zero_export
                  message: >-
                    OPEN PHASE released - PV {{ states('sensor.ems_solar_power') }} W,
                    battery {{ states('sensor.ems_battery_charge_power') }} W,
                    grid {{ states('sensor.ems_grid_power') }} W, SoC
                    {{ states('sensor.ems_battery_soc') }} %: the EMS regulates.
      # =====================================================================
      # snapshot: what the EMS wants right now, taken BEFORE the allowance is
      # updated below, so the write and the gate always work on the same value
      # =====================================================================
      - variables:
          target_pct: "{{ states('sensor.ems_limit_target') }}"
      # =====================================================================
      # charge acceptance learning - "how much charge power can the battery
      # really take?"  All of this is measurement driven, nothing is written to
      # the inverters, and it runs in FULL and in NIGHT. See NOTES section L.
      # =====================================================================
      - variables:
          lrn_ok: >-
            {{- is_state('input_boolean.ems_automatic', 'on')
                and states('sensor.ems_mode') in ['FULL', 'NIGHT']
                and has_value('sensor.ems_battery_charge_power')
                and has_value('input_number.ems_charge_allowance') -}}
          lrn_full: "{{ states('sensor.ems_mode') == 'FULL' }}"
          lrn_bat: "{{ states('sensor.ems_battery_charge_power') | float(0) }}"
          # The BASELINE of the current export episode. It follows the battery
          # up whenever the battery takes measurably more, so a still-rising
          # charge power keeps resetting the grace instead of counting towards
          # a cut. Only a charge power that has really PLATEAUED (below the
          # offer, for the whole grace) is proof that the battery cannot use
          # the offer. Without this an ESS ramp - which takes seconds to
          # minutes - was read as "the battery refuses the power", the
          # allowance was latched below the real acceptance and the array was
          # held under the charge limit for hours (the reported failure).
          lrn_rising: >-
            {{- (states('sensor.ems_battery_charge_power') | float(0))
                > (states('input_number.ems_bat_prev') | float(0)) + 50 -}}
          lrn_grid: "{{ states('sensor.ems_grid_power') | float(0) }}"
          lrn_tol: "{{ states('input_number.ems_export_tolerance') | float(150) }}"
          lrn_cmax: >-
            {%- set cmax = states('sensor.ems_charge_power_limit') | float(0) -%}
            {{- cmax if cmax > 0
                else (states('input_number.ems_max_charge_power') | float(2500)) -}}
          lrn_allow: "{{ states('input_number.ems_charge_allowance') | float(2500) }}"
          lrn_ticks: "{{ states('input_number.ems_export_ticks') | float(0) }}"
          lrn_exporting: >-
            {{- (states('sensor.ems_grid_power') | float(0))
                < -1 * (states('input_number.ems_export_tolerance') | float(150)) -}}
          # a lasting export is required before it counts: "EMS export grace"
          # seconds, counted in 15 s ticks (the heartbeat of this loop)
          lrn_needed: >-
            {{- [((states('input_number.ems_export_grace') | float(60)) / 15)
                 | round(0, 'ceil') | int(0), 1] | max -}}
          # no export since "EMS charge re-probe" -> try a higher allowance
          lrn_quiet: >-
            {%- if has_value('input_number.ems_charge_allowance') -%}
              {{- (now() - states.input_number.ems_charge_allowance.last_changed)
                  .total_seconds()
                  >= (states('input_number.ems_reprobe_seconds') | float(900)) -}}
            {%- else -%}false{%- endif -%}
      # 1) the array exports although the battery still has charge headroom ->
      #    the battery is not taking what it is offered: remember the measured
      #    acceptance, so the array stops exporting at THAT level instead of
      #    being cut back to the house load (which is what starved the battery)
      - if:
          - condition: template
            value_template: "{{ lrn_ok and lrn_full and lrn_exporting }}"
        then:
          - if:
              - condition: template
                value_template: >-
                  {{- lrn_ticks + 1 >= lrn_needed
                      and (lrn_allow - lrn_bat) > lrn_tol
                      and not lrn_rising -}}
            then:
              # at most a 50 % cut per step and never below what the battery is
              # measurably taking: one bad reading cannot stop the charge, and
              # the step is repeated until the export is gone
              - variables:
                  lrn_new: >-
                    {{- [[lrn_allow, [lrn_bat, lrn_allow / 2] | max] | min, 0]
                        | max | round(0) | int(0) -}}
              - action: system_log.write
                data:
                  level: warning
                  logger: opendtu.zero_export
                  message: >-
                    CHARGE ALLOWANCE: {{ lrn_allow }} W offered, battery takes
                    {{ lrn_bat }} W, grid exports {{ lrn_grid }} W for more than
                    {{ states('input_number.ems_export_grace') }} s
                    -> allowance limited to {{ lrn_new }} W
              - action: input_number.set_value
                target:
                  entity_id: input_number.ems_charge_allowance
                data:
                  value: "{{ lrn_new }}"
              - action: input_number.set_value
                target:
                  entity_id: input_number.ems_export_ticks
                data:
                  value: 0
            else:
              - if:
                  - condition: template
                    value_template: "{{ lrn_rising }}"
                then:
                  # the ESS is still ramping: not proof of anything. The grace
                  # restarts, so it only counts once the charge has settled.
                  - action: input_number.set_value
                    target:
                      entity_id: input_number.ems_export_ticks
                    data:
                      value: 0
                else:
                  - action: input_number.set_value
                    target:
                      entity_id: input_number.ems_export_ticks
                    data:
                      value: "{{ [lrn_ticks + 1, 99] | min | int(0) }}"
      # quiet grid - or the battery is still catching up: the export episode is
      # over or is not proof of anything yet. The grace restarts and the
      # baseline follows the battery, so only a REAL plateau below the offer
      # can be trimmed.
      - if:
          - condition: template
            value_template: "{{ lrn_ok and (not lrn_exporting or lrn_rising) }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.ems_export_ticks
            data:
              value: 0
          - action: input_number.set_value
            target:
              entity_id: input_number.ems_bat_prev
            data:
              value: "{{ lrn_bat }}"
      # 2) the battery discharges -> the old estimate is worthless, the next
      #    charge starts at the configured maximum again (not while the array
      #    is exporting: then the estimate below is the right answer)
      - if:
          - condition: template
            value_template: >-
              {{- lrn_ok and not lrn_exporting and (lrn_bat < -1 * lrn_tol)
                  and lrn_allow < lrn_cmax - 1 -}}
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.ems_charge_allowance
            data:
              value: "{{ lrn_cmax | round(0) | int(0) }}"
      # 3) no export for a while -> probe upwards: the BMS may have released
      #    the current limit, the pack may be warmer, the CV phase may be over
      - if:
          - condition: template
            value_template: >-
              {{- lrn_ok and not lrn_exporting and (lrn_bat > -1 * lrn_tol)
                  and lrn_allow < lrn_cmax - 1 and lrn_quiet -}}
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.ems_charge_allowance
            data:
              value: >-
                {{- [lrn_cmax, [lrn_allow * 1.5, lrn_allow + 100] | max]
                    | min | round(0) | int(0) -}}
      # =====================================================================
      # standby: at night there is nothing to write (the inverters sleep and
      # their persistent limit is what they wake up with)
      # =====================================================================
      - if:
          - condition: template
            value_template: "{{ states('sensor.ems_mode') == 'NIGHT' }}"
        then:
          - stop: "standby (night) - nothing written"
      # =====================================================================
      # write, with hysteresis + Victron settle time: only if the value really
      # changed, or if the last write is older than 3 minutes (non-persistent
      # limits can expire). A real export bypasses the settle time.
      # =====================================================================
      - if:
          - condition: template
            value_template: >-
              {%- set auto = is_state('input_boolean.ems_automatic', 'on') -%}
              {%- set cur = state_attr('sensor.ems_inverter_capacity', 'current_pct') | float(-1) -%}
              {%- set new = target_pct | float(-1) -%}
              {%- set hyst = states('input_number.ems_hysteresis_pct') | float(2) -%}
              {%- set settle = states('input_number.ems_settle_seconds') | float(12) -%}
              {%- set last = state_attr('input_datetime.ems_last_apply', 'timestamp') | float(0) -%}
              {%- set idle = now().timestamp() - last -%}
              {%- set refresh = last == 0 or idle > 180 -%}
              {#- a drop from a fully open array is applied immediately: that is
                  the hand-over from the day-start open phase, and it must not
                  wait out the settle time - less PV can never cause an export -#}
              {%- set emergency = (states('sensor.ems_grid_power') | float(0)) < -500
                                  or (cur >= 99.5 and new < cur - 1) -%}
              {%- set changed = new < 0 or cur < 0 or ((cur - new) | abs >= hyst) -%}
              {{ new >= 0 and
                 (not auto or refresh or (changed and (idle >= settle or emergency))) }}
        then:
          - if:
              - condition: state
                entity_id: input_boolean.ems_verbose
                state: "on"
            then:
              - action: system_log.write
                data:
                  level: debug
                  logger: opendtu.zero_export
                  message: >-
                    {{ states('sensor.ems_mode') }} |
                    grid {{ states('sensor.ems_grid_power') }}W
                    [{{ state_attr('sensor.ems_grid_power', 'source') }}] |
                    solar {{ states('sensor.ems_solar_power') }}W |
                    SoC {{ states('sensor.ems_battery_soc') }}% |
                    bat {{ states('sensor.ems_battery_power') }}W |
                    inv {{ state_attr('sensor.ems_inverter_capacity', 'active') }}/3
                    cap {{ states('sensor.ems_inverter_capacity') }}W |
                    limit {{ target_pct }}%
          - action: script.ems_apply
            data:
              pct: "{{ target_pct }}"


# =============================================================================
# 5b) DAY START - arm the open phase (released again by the control loop)
# -----------------------------------------------------------------------------
#  At sunrise there is nothing to throttle yet, so the array is opened to 100 %
#  and only trimmed once the sun delivers what the array can really produce and
#  the battery is charging at its calculated maximum. Without this the array
#  starts the day at the "house load + charge need" percentage (about 53 % with
#  the reference installation) and stays capped there while the pack fills -
#  i.e. below what the sun and the battery could do (NOTES N).
# =============================================================================
  - id: opendtu_ems_day_start
    alias: "OpenDTU EMS day start"
    description: >-
      Arms the day-start open phase: the array runs at 100 % until the sun is at
      full production (the battery can no longer soak up the PV) or an export
      appears. Fires at sunrise, when the mode leaves NIGHT and when it leaves
      STARTING, so a Home Assistant restart during the day arms it as well.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: sun
        event: sunrise
      # the normal morning: the mode leaves NIGHT when the sun is up and PV
      # starts flowing
      - trigger: state
        entity_id: sensor.ems_mode
        from: "NIGHT"
        to: "FULL"
      # a Home Assistant restart during the day
      - trigger: state
        entity_id: sensor.ems_mode
        from: "STARTING"
        to: "FULL"
    conditions:
      - condition: state
        entity_id: input_boolean.ems_enabled
        state: "on"
      # Arm only while the array is NOT yet at full production, the battery still
      # has charge headroom, nothing is exporting and there is somewhere for the
      # energy to go. Unknown sensors render as 0 here and pass - the release
      # tests in sensor.ems_limit_target decide in the same render anyway, so a
      # wrong arming can only ever cost one loop cycle.
      - condition: template
        value_template: >-
          {%- set open_w = states('input_number.ems_open_solar_w') | float(3500) -%}
          {%- set cmax = states('sensor.ems_charge_power_limit') | float(0) -%}
          {%- set cmax = (states('input_number.ems_max_charge_power') | float(2500))
                         if cmax <= 0 else cmax -%}
          {%- set tol = states('input_number.ems_export_tolerance') | float(150) -%}
          {%- set bat = states('sensor.ems_battery_charge_power') | float(0) -%}
          {%- set soc = states('sensor.ems_battery_soc') | float(0) -%}
          {{- open_w > 0
              and (states('sensor.ems_solar_power') | float(0)) < open_w
              and (states('sensor.ems_grid_power') | float(0)) > -1 * tol
              and bat < cmax - tol
              and not (soc >= (states('input_number.ems_soc_stop') | float(100))
                       and bat < tol) -}}
    actions:
      # only announce a real transition - the automation may fire once per
      # trigger and twice at sunrise
      - if:
          - condition: state
            entity_id: input_boolean.ems_open_phase
            state: "off"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.ems_open_phase
          - action: system_log.write
            data:
              level: info
              logger: opendtu.zero_export
              message: >-
                DAY START: array wide open (100 %) - PV
                {{ states('sensor.ems_solar_power') }} W, battery
                {{ states('sensor.ems_battery_charge_power') }} W,
                grid {{ states('sensor.ems_grid_power') }} W. Released as soon as
                the array reaches {{ states('input_number.ems_open_solar_w') }} W,
                the battery charges at its calculated maximum, or anything is
                exported.


# =============================================================================
# 6) WATCHDOG - detects "the loop stopped writing" and applies the fail-safe
# =============================================================================
  - id: opendtu_ems_watchdog
    alias: "OpenDTU EMS watchdog"
    description: >-
      If the control loop has not written a limit for longer than the timeout,
      the inverters are set to the fail-safe limit and a notification is raised.
      The fail-safe write also refreshes the heartbeat, so the alarm is not
      repeated every cycle. It also reports a capacity shortfall, i.e. when the
      reachable inverters already run at 100 % and the grid still imports - a
      sign that one inverter is offline or that a big load is running.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/2"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.ems_enabled
        state: "on"
      # never fight the manual override
      - condition: state
        entity_id: input_boolean.ems_automatic
        state: "on"
    actions:
      # last_ts == 0 means "never written yet" -> the loop writes within 30 s,
      # so this is not treated as stale (avoids a spurious alarm after boot).
      # The mode must also have been stable for the timeout: without that, the
      # first run after the NIGHT -> FULL transition could fire, because the
      # loop never writes at night.
      - variables:
          last_ts: "{{ state_attr('input_datetime.ems_last_apply', 'timestamp') | float(0) }}"
          timeout: "{{ 300 }}"
          stale: >-
            {{- last_ts > 0 and (now().timestamp() - last_ts) > timeout
                and states('sensor.ems_mode') not in ['STARTING', 'NIGHT', 'DTU_BLIND']
                and (now() - states.sensor.ems_mode.last_changed).total_seconds() > timeout -}}
      - if:
          - condition: template
            value_template: "{{ stale }}"
        then:
          - action: system_log.write
            data:
              level: warning
              logger: opendtu.zero_export
              message: >-
                WATCHDOG: no limit written for more than {{ timeout }} s
                (last write {{ last_ts | timestamp_local }}). Applying fail-safe
                limit {{ states('input_number.ems_failsafe_pct') }}%.
          - action: persistent_notification.create
            data:
              title: OpenDTU EMS fail-safe active
              notification_id: opendtu_ems_failsafe
              message: >-
                The EMS control loop stopped writing inverter limits.
                The inverters were set to the fail-safe limit
                ({{ states('input_number.ems_failsafe_pct') }} %) so that no
                energy is exported. Last write: {{ last_ts | timestamp_local }}.
                Check the EMS automations and sensor.ems_mode.
          - action: script.ems_apply
            data:
              pct: "{{ states('input_number.ems_failsafe_pct') | float(0) }}"
      # capacity shortfall: fewer than 3 inverters reachable, they already run
      # at 100 % and the grid still imports while PV is being produced
      - if:
          - condition: template
            value_template: >-
              {{- (state_attr('sensor.ems_inverter_capacity', 'active') | int(0)) > 0
                  and (state_attr('sensor.ems_inverter_capacity', 'active') | int(3)) < 3
                  and (state_attr('sensor.ems_inverter_capacity', 'current_pct') | float(0)) >= 99.5
                  and (states('sensor.ems_grid_power') | float(0)) > 200
                  and (states('sensor.ems_solar_power') | float(0)) > 200 -}}
        then:
          - action: persistent_notification.create
            data:
              title: OpenDTU EMS - PV capacity short
              notification_id: opendtu_ems_capacity
              message: >-
                Only {{ state_attr('sensor.ems_inverter_capacity', 'active') }} of
                3 micro inverters are reachable and the remaining ones already run
                at {{ state_attr('sensor.ems_inverter_capacity', 'current_pct') }} %.
                The grid still imports {{ states('sensor.ems_grid_power') }} W while
                PV is producing {{ states('sensor.ems_solar_power') }} W, so the
                reachable capacity cannot cover load + charging. Check the missing
                inverter in OpenDTU, or accept the shortfall.
      # no inverter reachable at all: OpenDTU off, MQTT down or ids changed
      - if:
          - condition: template
            value_template: >-
              {{- states('sensor.ems_mode') == 'DTU_BLIND'
                  and is_state('input_boolean.ems_enabled', 'on') -}}
        then:
          - action: persistent_notification.create
            data:
              title: OpenDTU EMS - no inverter reachable
              notification_id: opendtu_ems_dtu
              message: >-
                None of the inverter limit entities is readable, so the EMS cannot
                control anything and writes nothing. OpenDTU is probably powered
                off, the MQTT connection is down, or the entity ids in section 1 of
                the package changed. Grid and battery sensors are not affected.
                The loop resumes by itself as soon as an inverter is reachable.
      # under-delivery: the inverters are commanded to more than they deliver,
      # even though the grid still imports. Counted over consecutive runs so
      # that a passing cloud does not raise an alarm.
      - if:
          - condition: template
            value_template: >-
              {{- (states('sensor.ems_pv_delivery') | float(100)) < 70
                  and ((state_attr('sensor.ems_pv_delivery', 'expected_w') | float(0))
                       - (states('sensor.ems_solar_power') | float(0))) > 800
                  and (state_attr('sensor.ems_pv_delivery', 'expected_w') | float(0)) > 500
                  and (states('sensor.ems_solar_power') | float(0)) > 200
                  and (states('sensor.ems_grid_power') | float(0)) > 0 -}}
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.ems_delivery_short
            data:
              value: >-
                {{ [states('input_number.ems_delivery_short') | float(0) + 1, 9] | min | int(0) }}
        else:
          - action: input_number.set_value
            target:
              entity_id: input_number.ems_delivery_short
            data:
              value: 0
      # notify exactly once per episode (counter reaches 3 = ~6 minutes)
      - if:
          - condition: template
            value_template: "{{ states('input_number.ems_delivery_short') | float(0) == 3 }}"
        then:
          - action: persistent_notification.create
            data:
              title: OpenDTU EMS - PV under-delivering
              notification_id: opendtu_ems_delivery
              message: >-
                The inverters have been commanded to about
                {{ state_attr('sensor.ems_pv_delivery', 'expected_w') }} W for more
                than 6 minutes but only produce
                {{ states('sensor.ems_solar_power') }} W
                ({{ states('sensor.ems_pv_delivery') }} %), while the grid still
                imports {{ states('sensor.ems_grid_power') }} W.
                Either an inverter does not deliver (offline, shaded, stuck on a low
                persistent limit) - check "reachable"/"producing" for each inverter
                in OpenDTU - or it is simply heavily clouded. The notification
                repeats only after the output recovers.


# =============================================================================
# 7) STARTUP MARKER - the start time, and the documented defaults on a fresh
#    installation
# =============================================================================
  - id: opendtu_ems_boot
    alias: "OpenDTU EMS boot"
    description: >-
      Records the Home Assistant start time. sensor.ems_mode stays STARTING for
      "EMS start grace" seconds afterwards, so that neither half-initialised
      sensors nor an ESS that is still booting can cause a wrong limit write.
      On the very first start after the installation it also applies the
      documented helper defaults (script.ems_set_defaults), because Home
      Assistant creates an input_number without an "initial" value at its
      minimum, and it warns when "EMS max charge power" is still 0 W.
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      # ems_started_at is only ever written below, so it is still 0 exactly on
      # the first start after the package was installed.
      - variables:
          first_boot: >-
            {{- (state_attr('input_datetime.ems_started_at', 'timestamp')
                 | float(0)) == 0 -}}
      # record the start time first: whatever the helpers still hold, the loop
      # is in STARTING from the first moment of this start
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ems_started_at
        data:
          timestamp: "{{ now().timestamp() }}"
      # The mapping is what lets the loop read ANY sensor. An empty entry is the
      # one failure that cannot be seen from the sensors themselves (the mode
      # just stays GRID_BLIND / NO_BATTERY), so say it out loud at every start.
      # Read from the input_text helpers directly - sensor.ems_map_status is a
      # template sensor and may not have rendered yet this early.
      - if:
          - condition: template
            value_template: >-
              {%- set unset = ['', 'unknown', 'unavailable', 'none'] -%}
              {%- set ns = namespace(n=0) -%}
              {%- for v in [states('input_text.ems_src_grid'),
                            states('input_text.ems_src_solar'),
                            states('input_text.ems_src_batt_soc'),
                            states('input_text.ems_src_batt_power'),
                            states('input_text.ems_src_inv1_limit'),
                            states('input_text.ems_src_inv2_limit'),
                            states('input_text.ems_src_inv3_limit')]
                  if (v | string | lower) in unset -%}
                {%- set ns.n = ns.n + 1 -%}
              {%- endfor -%}
              {{ ns.n > 0 }}
        then:
          - action: persistent_notification.create
            data:
              notification_id: opendtu_ems_mapping
              title: OpenDTU EMS - the sensor mapping is incomplete
              message: >-
                The EMS reads every sensor through the mapping in section 1 of
                the package, and at least one required entry is still empty, so
                the loop cannot regulate anything. Run the blueprint "OpenDTU EMS
                - the sensor names" (Settings > Automations & scenes >
                Blueprints) or fill the "EMS source - ..." helpers by hand.
                sensor.ems_map_status lists exactly what is missing.
        else:
          - action: persistent_notification.dismiss
            data:
              notification_id: opendtu_ems_mapping
      # A fresh installation must not run on empty helpers (they are created at
      # their minimum: 0 W charge power, 0 W bias, 0 s grace, ...). Seed the
      # documented defaults once - never again, so the tuning and the learned
      # charge allowance survive every later restart.
      - if:
          - condition: template
            value_template: "{{ first_boot }}"
        then:
          - action: system_log.write
            data:
              level: info
              logger: opendtu.zero_export
              message: >-
                FIRST START: the EMS helpers are still empty - applying the
                documented defaults (script.ems_set_defaults).
          - action: script.ems_set_defaults
      # "EMS max charge power = 0" is a legitimate choice (zero export, never
      # charge from PV) - but it is also what an installation from before 1.6.0
      # was left with, and then the battery is never charged from the array.
      # Nothing can be told at night, so this only speaks while PV is possible.
      - if:
          - condition: template
            value_template: >-
              {{- (states('input_number.ems_max_charge_power') | float(0)) == 0
                  and (states('sensor.ems_solar_power') | float(0)) > 200 -}}
        then:
          - action: persistent_notification.create
            data:
              notification_id: opendtu_ems_defaults
              title: OpenDTU EMS - no charge power configured
              message: >-
                "EMS max charge power" is 0 W, so the loop never asks the array
                for charge power and the battery is only charged from the grid,
                if at all. Installations from before 1.6.0 start like this,
                because Home Assistant creates the helpers empty. Set it to
                min(DVCC max charge current, BMS CCL) x battery voltage
                (2500 W for 50 A x 50 V), or run the action
                script.ems_set_defaults to apply every documented default.
        else:
          - action: persistent_notification.dismiss
            data:
              notification_id: opendtu_ems_defaults
      - action: system_log.write
        data:
          level: info
          logger: opendtu.zero_export
          message: >-
            STARTUP: waiting {{ states('input_number.ems_start_grace') }} s before
            the first inverter write.


# =============================================================================
# 8) NOTES - where the reasoning lives
# -----------------------------------------------------------------------------
#  This file is the control law, not the manual. The reasoning behind it - why
#  the target is feed forward, why the bias is subtracted, what the modes mean,
#  how the charge acceptance is learned, what the watchdog watches and how to
#  test the whole thing - lives in the wiki, one page per topic:
#
#   How it works      the target formula, the mode ladder, the control loop,
#                     the day-start open phase, capacity and redistribution,
#                     the watchdog and what is deliberately NOT in here
#   Charge allowance  the learning (trim / reset / upward probe), the ramp
#                     guard of 1.9.0 and what each knob trades away
#   Sensor mapping    the 15 input_text helpers, what each must be, what an
#                     empty and what a wrong entry does
#   Installation      HACS, packages:, the blueprint, the hardware backstop
#   Dashboards        both boards, the mapping gate, two easy experiments
#   Reference         every helper, sensor, script and automation with its
#                     meaning and its documented default
#   Troubleshooting   symptom -> cause, the notifications, the mode ladder
#   Upgrading         version by version, including the 1.10.0 migration
#
#   https://github.com/acdcnow/opendtu-ems/wiki
#
#  THE THREE JINJA TRAPS this file has already fallen into - keep them in mind
#  when you edit anything below:
#
#   1) A template CONDITION is false for everything except true/yes/on/enable
#      and non-zero numbers. "{{ some_entity_id }}" renders the entity id - a
#      non-empty STRING - so the condition is FALSE and the step is skipped in
#      silence (the write is also inside continue_on_error). Every guard must
#      render a real boolean; see script.ems_apply.
#   2) A plain {% set n = n + 1 %} inside a {% for %} does NOT survive the loop.
#      Counters need a namespace (see sensor.ems_map_status).
#   3) A template sensor with unit_of_measurement or state_class must render a
#      NUMBER - never a string, not even "unknown"/"unavailable". Render
#      float(0) behind an availability check (see the mirrors in section 3).
#
#  HOW TO VERIFY A CHANGE - all five, in this order:
#
#      python tests/validate_package.py      templates, frozen scenarios, docs
#      python tests/validate_dashboards.py   every card template renders
#      python tests/validate_integration.py  bundle == sources, manifest, HACS
#      python tests/simulate_day.py          a whole day at 10 s resolution
#      python tests/validate_in_ha.py        in a REAL Home Assistant (needs HA)
#
#  The last one is the important one: it boots Home Assistant, loads this file
#  and drives the chain, because an invalid config key does not raise - it drops
#  a whole platform with one log line, and a dashboard wired to an entity that
#  does not exist renders nothing and logs nothing.
# =============================================================================
