# =============================================================================
#  OpenDTU EMS  -  Lovelace view 1 of 2:  "Energy"  (the everyday overview)
# -----------------------------------------------------------------------------
#  WHAT THIS BOARD IS FOR
#    The one you keep open. It answers "what is the system doing right now?"
#    without any parameter you could accidentally change:
#      1) live energy flow        grid / PV / battery / house, one picture
#      2) status chips            mode, limit, charge offer, inverters, health
#      3) key figures             SoC, EMS limit, battery charge, charge limit
#      4) the day so far          PV / house / grid / battery + the EMS limit
#      5) the controls you touch daily (kill switch, automatic mode, manual %)
#
#  TUNING IS NOT HERE.  It lives on view 2, dashboards/ems-expert.yaml, and even
#  there it is only visible while input_boolean.ems_expert_mode is on - the
#  "Expert mode" switch below flips it.
#
#  REQUIRED HACS FRONTEND CARDS (all in the HACS default repositories)
#    - Power Flow Card Plus     flixlix/power-flow-card-plus
#    - Mushroom                 piitaya/lovelace-mushroom
#    - ApexCharts Card          RomRider/apexcharts-card
#    - Mini Graph Card          kalkih/mini-graph-card
#  Everything else is built into Home Assistant.
#
#  HOW TO USE
#    New dashboard ("Start with an empty dashboard") -> Edit -> three dot menu ->
#    Raw configuration editor -> paste this whole file.  Or paste the `cards:`
#    list under an existing `views:` entry (keep the indentation).
#
#  NO ENTITY IDS TO EDIT: every foreign sensor is read through the SENSOR
#  MAPPING of the package (input_text.ems_src_*). Fill it with the script
#  blueprint "OpenDTU EMS - the sensor names". The PV chip falls back to
#  "3 inputs" while ems_src_inv1_power .. inv3_power are empty, and the mode
#  chip just omits the Victron stage while ems_src_victron_state is empty.
#  sensor.ems_map_status says what is still missing.
# =============================================================================

title: Energy
path: energy
icon: mdi:solar-power-variant

cards:
  # ---------------------------------------------------------------------------
  # 0) the MAPPING GATE
  #    Both boards are wired to the EMS sensors, and those stay empty until the
  #    sensor mapping (section 1 of the package) says which sensors to read.
  #    Without this card that looks like a broken dashboard; with it the reason
  #    is on the board and disappears by itself once the mapping is filled.
  # ---------------------------------------------------------------------------
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.ems_map_status
        state_not: "ok"
    card:
      type: markdown
      content: >-
        ### The sensor mapping is not complete

        **{{ states('sensor.ems_map_status') }}** — the EMS reads every sensor
        through the *sensor mapping* (section 1 of `packages/opendtu_ems.yaml`),
        so the cards below stay empty until the mapping is filled.

        * required, still empty:
          **{{ (state_attr('sensor.ems_map_status', 'required_missing') or []) | join(', ') or '—' }}**
        * optional, still empty:
          {{ (state_attr('sensor.ems_map_status', 'optional_empty') or []) | join(', ') or '—' }}

        Fill it with the blueprint **OpenDTU EMS - the sensor names**
        (Settings → Automations & scenes → Blueprints → *Create script* → run it
        once) or by hand: Settings → Devices & services → **Helpers** →
        *EMS source - …*. `sensor.ems_mode` stays `GRID_BLIND` / `NO_BATTERY`
        until then.

  # ---------------------------------------------------------------------------
  # 1) live energy flow
  #    sign conventions already match the card:
  #      grid     positive = import, negative = export
  #      battery  positive = charging, negative = discharging
  #      solar    positive = production
  # ---------------------------------------------------------------------------
  - type: custom:power-flow-card-plus
    title: Energy flow
    clickable_entities: true
    use_new_flow_rate_model: true
    min_expected_power: 10
    max_expected_power: 5000
    kilo_threshold: 10000
    display_zero_lines:
      mode: transparency
      transparency: 70
    entities:
      grid:
        entity: sensor.ems_grid_power
        name: Grid
        display_state: one_way
        color_circle: true
        display_zero_tolerance: 20
        secondary_info:
          template: >-
            {{ state_attr('sensor.ems_grid_power', 'source') or '-' }}
      solar:
        entity: sensor.ems_solar_power
        name: PV
        display_zero_state: true
        secondary_info:
          template: >-
            {#- the three per-inverter power sensors come from the mapping -#}
            {%- set ids = [states('input_text.ems_src_inv1_power'),
                           states('input_text.ems_src_inv2_power'),
                           states('input_text.ems_src_inv3_power')] -%}
            {%- set ns = namespace(vals=[]) -%}
            {%- for i in ids if i and has_value(i) -%}
              {%- set ns.vals = ns.vals + [(states(i) | float(0) | round(0) | int(0))] -%}
            {%- endfor -%}
            {%- if ns.vals | count -%}{{ ns.vals | join(' / ') }} W
            {%- else -%}3 inputs{%- endif -%}
      battery:
        entity: sensor.ems_battery_power
        name: Battery
        state_of_charge: sensor.ems_battery_soc
        display_state: one_way
        color_state_of_charge_value: color_dynamically
      home:
        entity: sensor.ems_house_load
        name: House
        override_state: true
        color_icon: true

  # ---------------------------------------------------------------------------
  # 2) status at a glance - one chip per question you actually ask
  # ---------------------------------------------------------------------------
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
      - type: template
        entity: sensor.ems_mode
        icon: mdi:state-machine
        content: >-
          {%- set m = states('sensor.ems_mode') -%}
          {%- set v = '' -%}
          {#- the Victron charge stage comes from the mapping (optional) -#}
          {%- set stage = states('input_text.ems_src_victron_state') -%}
          {%- if stage and has_value(stage) -%}
            {%- set v = ' · ' ~ states(stage) -%}
          {%- endif -%}
          {{ m }}{{ v }}
        icon_color: >-
          {%- set m = states('sensor.ems_mode') -%}
          {%- if m == 'FULL' -%}green
          {%- elif m in ['NIGHT', 'STARTING'] -%}blue
          {%- elif m == 'NO_BATTERY' -%}orange
          {%- else -%}red{%- endif -%}
        tap_action:
          action: more-info
      - type: template
        entity: sensor.ems_limit_target
        icon: >-
          {{ 'mdi:weather-sunset-up' if is_state('input_boolean.ems_open_phase', 'on')
             else 'mdi:speedometer' }}
        content: >-
          {%- if is_state('input_boolean.ems_open_phase', 'on') -%}
            day start · array open
          {%- else -%}
            limit {{ states('sensor.ems_limit_target') }} %
          {%- endif -%}
        icon_color: indigo
        tap_action:
          action: more-info
      - type: template
        entity: sensor.ems_limit_target
        icon: mdi:battery-arrow-up-outline
        content: >-
          {%- set a = state_attr('sensor.ems_limit_target', 'allowance') -%}
          {%- set p = state_attr('sensor.ems_limit_target', 'charge_push') -%}
          {%- if a is not none -%}
            offer {{ a }} W · push {{ p }} W
          {%- else -%}offer – W{%- endif -%}
        icon_color: >-
          {{ 'green' if (state_attr('sensor.ems_limit_target', 'charge_push') | float(0)) > 0
             else 'grey' }}
        tap_action:
          action: more-info
      - type: template
        entity: sensor.ems_inverter_capacity
        icon: mdi:solar-panel
        content: >-
          {{ state_attr('sensor.ems_inverter_capacity', 'active') }}/3 ·
          {{ states('sensor.ems_inverter_capacity') }} W
        icon_color: >-
          {{ 'green' if (state_attr('sensor.ems_inverter_capacity', 'active') | int(0)) == 3
             else 'orange' }}
        tap_action:
          action: more-info
      - type: template
        entity: binary_sensor.ems_degraded
        icon: >-
          {{ 'mdi:alert-outline' if is_state('binary_sensor.ems_degraded', 'on')
             else 'mdi:check-circle-outline' }}
        content: >-
          {{ 'degraded' if is_state('binary_sensor.ems_degraded', 'on') else 'ok' }}
        icon_color: >-
          {{ 'red' if is_state('binary_sensor.ems_degraded', 'on') else 'green' }}
        tap_action:
          action: more-info

  # ---------------------------------------------------------------------------
  # 3) the numbers that say whether the loop is doing its job
  # ---------------------------------------------------------------------------
  - type: grid
    columns: 4
    square: false
    cards:
      - type: gauge
        entity: sensor.ems_battery_soc
        name: SoC
        min: 0
        max: 100
        needle: true
        severity:
          red: 20
          yellow: 50
          green: 80
      - type: gauge
        entity: sensor.ems_limit_target
        name: EMS limit
        min: 0
        max: 100
        needle: true
        severity:
          red: 5
          yellow: 20
          green: 40
      - type: gauge
        entity: sensor.ems_battery_charge_power
        name: Battery charge
        min: -2000
        max: 3000
        needle: true
        severity:
          red: -2000
          yellow: -100
          green: 100
      - type: gauge
        entity: sensor.ems_charge_power_limit
        name: Charge power limit
        min: 0
        max: 3000
        needle: true
        severity:
          grey: 0

  # ---------------------------------------------------------------------------
  # 4) the day so far: PV, house, grid, battery (W) and the EMS limit (%)
  # ---------------------------------------------------------------------------
  - type: custom:apexcharts-card
    header:
      show: true
      title: PV · house · grid · battery (today)
      show_states: false
    graph_span: 24h
    span:
      start: day
    now:
      show: true
      label: now
    all_series_config:
      type: line
      stroke_width: 2
      group_by:
        func: avg
        duration: 5min
    yaxis:
      - id: power
        decimals: 0
        apex_config:
          tickAmount: 4
      - id: pct
        show: false
        min: 0
        max: 100
    series:
      - entity: sensor.ems_solar_power
        name: PV
        type: area
        yaxis_id: power
        color: "#ffb300"
        opacity: 0.15
      - entity: sensor.ems_house_load
        name: House
        yaxis_id: power
        color: "#44739e"
      - entity: sensor.ems_grid_power
        name: Grid (+ import)
        yaxis_id: power
        color: "#e02b3f"
        color_threshold:
          - value: 0
            color: "#43a047"
          - value: 1
            color: "#e02b3f"
      - entity: sensor.ems_battery_power
        name: Battery (+ charge)
        yaxis_id: power
        color: "#8e44ad"
      - entity: sensor.ems_limit_target
        name: EMS limit
        yaxis_id: pct
        color: "#9e9e9e"
        stroke_width: 1
        curve: stepline
        opacity: 0.6

  # ---------------------------------------------------------------------------
  # 5) battery SoC history beside the daily controls
  # ---------------------------------------------------------------------------
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mini-graph-card
        name: Battery state of charge
        icon: mdi:battery-heart-variant
        entities:
          - entity: sensor.ems_battery_soc
            name: SoC
        min: 0
        max: 100
        hours_to_show: 48
        points_per_hour: 6
        line_width: 2
        show:
          labels: true
          fill: true
        color_thresholds:
          - value: 20
            color: "#e02b3f"
          - value: 50
            color: "#f7c948"
          - value: 80
            color: "#43a047"
      - type: entities
        title: Daily controls
        show_header_toggle: false
        entities:
          - entity: input_boolean.ems_enabled
            name: EMS active
          - entity: input_boolean.ems_automatic
            name: Automatic mode
          - entity: input_number.ems_manual_pct
            name: Manual limit (automatic mode off)
          - entity: input_boolean.ems_expert_mode
            name: Expert mode (reveal the tuning board)
          - entity: input_datetime.ems_last_apply
            name: Last limit written

  # ---------------------------------------------------------------------------
  # 6) one block of diagnostics and the pointer to the tuning board
  # ---------------------------------------------------------------------------
  - type: markdown
    title: EMS diagnostics
    content: >-
      **Mode** {{ states('sensor.ems_mode') }} ·
      **meter** {{ state_attr('sensor.ems_grid_power', 'source') }}
      ({{ states('sensor.ems_grid_power') }} W) ·
      **inverters** {{ state_attr('sensor.ems_inverter_capacity', 'active') }}/3
      at {{ state_attr('sensor.ems_inverter_capacity', 'current_pct') }} %


      **commanded** {{ state_attr('sensor.ems_pv_delivery', 'expected_w') }} W ·
      **produced** {{ state_attr('sensor.ems_pv_delivery', 'actual_w') }} W


      **sensor mapping** {{ states('sensor.ems_map_status') }}
      ({{ states('sensor.ems_pv_delivery') }} %) ·
      **limit** {{ states('sensor.ems_limit_target') }} %


      **charge power** {{ states('sensor.ems_battery_charge_power') }} W of
      {{ states('sensor.ems_charge_power_limit') }} W allowed ·
      **source** {{ state_attr('sensor.ems_battery_charge_power', 'source') }} ·
      **started** {{ states('input_datetime.ems_started_at') }}


      Tuning, the learned charge offer and the full history are on the
      **EMS Expert** view (`dashboards/ems-expert.yaml`) - switch
      *Expert mode* on there to reveal the controls.
